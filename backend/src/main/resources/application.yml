server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: reusehub-backend
  datasource:
    # Defaults to H2 in-memory so developers can test immediately; override with DB_URL for PostgreSQL
    url: ${DB_URL:jdbc:h2:mem:reusehub_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # 256-bit HMAC secret key for token signing
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: "http://localhost:3000,http://127.0.0.1:3000"

logging:
  level:
    com.reusehub: DEBUG
    org.springframework.security: INFO

